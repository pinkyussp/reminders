name: Rust Android build

on:
  push:
    branches: [main]
    paths:
      - "app-rust/**"
      - ".github/workflows/rust-android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 2.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspace: app-rust

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust library for arm64
        working-directory: app-rust
        run: cargo ndk -t arm64-v8a -P 26 -o android/app/src/main/jniLibs build --release --lib

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        working-directory: app-rust/android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Name the APK
        run: cp app-rust/android/app/build/outputs/apk/release/app-release.apk "Dates-${VERSION_NAME}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION_NAME}" "Dates-${VERSION_NAME}.apk" \
            --title "Dates ${VERSION_NAME} (Rust)" \
            --notes "Native Rust build. First step: the app shell. Screens are being added." \
            --target "$GITHUB_SHA"
